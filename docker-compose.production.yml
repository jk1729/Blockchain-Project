  pdschain-app:
    build:
      context: .
      dockerfile: Dockerfile.app
    image: pdschain/app:1.0.0
    container_name: pdschain-app
    restart: unless-stopped
    networks:
      - pdschain-prod-net
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_DIALECT: postgres
      DATABASE_URL: postgres://${POSTGRES_USER:-pdschain}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-pdschain}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET (min 32 chars) is required in production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required in production}
      EVENTS_JOURNAL_PATH: /app/database/events_journal.jsonl
      SECURITY_AUDIT_PATH: /app/database/security_audit.jsonl
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - pdschain_data:/app/database
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3000/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  pdschain_pgdata:
    driver: local
  pdschain_data:
    driver: local
  val01_storage:
  val02_storage:
  val03_storage:
  val04_storage:
  val05_storage:
  val06_storage:
  val07_storage:
  val08_storage:
  val09_storage:
  val10_storage:
  val11_storage:
  val12_storage:
