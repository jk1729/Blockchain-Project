version: '3.8'

networks:
  pdschain-prod-net:
    driver: bridge

x-validator-prod: &validator-prod
  build:
    context: .
    dockerfile: Dockerfile
  image: pdschain/validator:1.0.0
  restart: unless-stopped
  networks:
    - pdschain-prod-net
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  postgres:
    image: postgres:16-alpine
    container_name: pdschain-postgres
    restart: unless-stopped
    networks:
      - pdschain-prod-net
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pdschain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-pdschain}
    volumes:
      - pdschain_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pdschain} -d ${POSTGRES_DB:-pdschain}"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true

  validator-01:
    <<: *validator-prod
    container_name: pdschain-val-01
    environment:
      NODE_ENV: production
      VALIDATOR_ID: VAL-01
      SHORT_VALIDATOR_ID: V1
      CHAIN_ID: 1729
      API_PORT: 4001
      P2P_PORT: 5001
      DATA_DIR: /data
    ports:
      - "4001:4001"
    volumes:
      - val01_storage:/data

  validator-02:
    <<: *validator-prod
    container_name: pdschain-val-02
    environment:
      NODE_ENV: production
      VALIDATOR_ID: VAL-02
      SHORT_VALIDATOR_ID: V2
