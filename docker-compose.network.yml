version: '3.8'

networks:
  pdschain-net:
    driver: bridge

x-validator-common: &validator-common
  build:
    context: .
    dockerfile: Dockerfile
  image: pdschain/validator:1.0.0
  restart: unless-stopped
  networks:
    - pdschain-net
  security_opt:
    - no-new-privileges:true

services:
  validator-01:
    <<: *validator-common
    container_name: pdschain-val-01
    environment:
      - NODE_ENV=development
      - VALIDATOR_ID=VAL-01
      - SHORT_VALIDATOR_ID=V1
      - NETWORK_ID=pdschain-devnet
      - CHAIN_ID=1729
      - API_PORT=4001
      - P2P_PORT=5001
      - P2P_HOST=0.0.0.0
      - API_HOST=0.0.0.0
      - DATA_DIR=/data
    ports:
      - "4001:4001"
      - "5001:5001"
    volumes:
      - val01_storage:/data

  validator-02:
